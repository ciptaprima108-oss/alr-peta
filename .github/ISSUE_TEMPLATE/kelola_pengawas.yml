name: Kelola pengawas (tambah / hapus)
description: Tambah atau hapus pengawas ALR / RM yang menerima notif trigger. Hanya bisa diproses kalau dibuat oleh admin repo.
title: "[PENGAWAS] "
labels: ["kelola-pengawas"]
body:
  - type: input
    id: aksi
    attributes:
      label: Aksi
      description: Tulis Tambah atau Hapus (sudah terisi otomatis kalau dibuka dari peta)
      placeholder: Tambah
    validations:
      required: true
  - type: input
    id: username
    attributes:
      label: Username GitHub pengawas
      description: Pengawas daftar dulu gratis di github.com/signup, lalu kirim username-nya
      placeholder: "contoh: budi-alr"
    validations:
      required: true
  - type: input
    id: nama
    attributes:
      label: Nama
      placeholder: "contoh: Budi Santoso"
  - type: input
    id: jabatan
    attributes:
      label: Jabatan
      placeholder: "contoh: Pengawas ALR / RM"
