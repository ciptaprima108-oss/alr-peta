name: Hitung trigger & tayangkan peta

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]
  workflow_dispatch:
  schedule:              # tarik data TrackSolid tiap 30 menit (jam bisa telat 5-15 mnt, normal di GitHub)
    - cron: "15,45 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: peta
  cancel-in-progress: false

jobs:
  peta:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy openpyxl

      # data GPS live disimpan di cache Actions (bukan di repo, supaya repo tidak bengkak)
      - name: Ambil data GPS live sebelumnya
        uses: actions/cache/restore@v4
        with:
          path: data/gps/live_tracksolid.csv
          key: gps-live-${{ github.run_id }}
          restore-keys: gps-live-

      - name: Tarik data terbaru dari TrackSolid
        id: tarik
        if: github.event_name != 'push'
        env:
          TS_APP_KEY: ${{ secrets.TS_APP_KEY }}
          TS_APP_SECRET: ${{ secrets.TS_APP_SECRET }}
          TS_USER: ${{ secrets.TS_USER }}
          TS_PASS: ${{ secrets.TS_PASS }}
          TS_PASS_MD5: ${{ secrets.TS_PASS_MD5 }}
          TS2_USER: ${{ secrets.TS2_USER }}
          TS2_PASS_MD5: ${{ secrets.TS2_PASS_MD5 }}
          TS_URL: ${{ secrets.TS_URL }}
          TS_MAPPING_CSV: ${{ secrets.TS_MAPPING_CSV }}
          TS_SHEET_ID: ${{ secrets.TS_SHEET_ID }}
        run: python scripts/tarik_tracksolid.py

      - name: Simpan data GPS live
        if: steps.tarik.outputs.lanjut == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/gps/live_tracksolid.csv
          key: gps-live-${{ github.run_id }}

      - name: Hitung status jalan per segmen
        if: steps.tarik.outputs.lanjut != 'false'
        run: python scripts/hitung_trigger.py

      - name: Hitung performa harian (grafik kelayakan)
        if: steps.tarik.outputs.lanjut != 'false'
        run: cd scripts && python hitung_performa.py

      - name: Hitung perkiraan RR & traksi per KM
        if: steps.tarik.outputs.lanjut != 'false'
        run: cd scripts && python hitung_rr_traksi.py

      - name: Simpan hasil ke repo
        if: steps.tarik.outputs.lanjut != 'false'
        run: |
          git config user.name "alr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git add data/elevasi_jalur.csv 2>/dev/null || true
          git add data/hujan_harian.csv 2>/dev/null || true
          # run terjadwal: commit cuma sekali sehari (jam 00 WIB); peta tetap update tiap 30 mnt lewat Pages
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Jakarta date +%H)" != "00" ]; then
            echo "Run terjadwal, tidak commit"; exit 0
          fi
          git diff --cached --quiet || git commit -m "Update status jalan ALR [skip ci]"
          git pull --rebase -X theirs || true
          git push

      - name: Bikin tiket trigger + notif pengawas
        if: steps.tarik.outputs.lanjut != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/buat_tiket.py

      - name: Stempel versi (supaya browser ambil file terbaru)
        if: steps.tarik.outputs.lanjut != 'false'
        run: |
          v=$(date +%Y%m%d%H%M)
          sed -i -E "s#([a-z_]+)\.(js|css)\?v=[0-9]+\"#\1.\2?v=$v\"#g" docs/*.html
          sed -i -E "s#<meta name=\"versi\" content=\"v[0-9]+\">#<meta name=\"versi\" content=\"v$v\">#" docs/index.html
          echo "v$v" > docs/versi.txt
      - uses: actions/configure-pages@v5
        if: steps.tarik.outputs.lanjut != 'false'
      - uses: actions/upload-pages-artifact@v4
        if: steps.tarik.outputs.lanjut != 'false'
        with:
          path: docs
      - name: Tunggu artifact terdaftar
        if: steps.tarik.outputs.lanjut != 'false'
        run: sleep 20
      - id: deploy
        if: steps.tarik.outputs.lanjut != 'false'
        uses: actions/deploy-pages@v4
