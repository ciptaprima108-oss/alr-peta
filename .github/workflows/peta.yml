name: Hitung trigger & tayangkan peta

on:
  push:
    branches: [main]
    paths-ignore: ["docs/data/**"]
  workflow_dispatch:
  # schedule:            # aktifkan kalau nanti data GPS ditarik otomatis
  #   - cron: "0 * * * *"

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: peta
  cancel-in-progress: false

jobs:
  peta:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy openpyxl

      - name: Hitung status jalan per segmen
        run: python scripts/hitung_trigger.py

      - name: Hitung performa harian (grafik kelayakan)
        run: cd scripts && python hitung_performa.py

      - name: Simpan hasil ke repo
        run: |
          git config user.name "alr-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Update status jalan ALR [skip ci]"
          git pull --rebase -X theirs || true
          git push

      - name: Bikin tiket trigger + notif pengawas
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/buat_tiket.py

      - name: Stempel versi (supaya browser ambil file terbaru)
        run: |
          v=$(date +%Y%m%d%H%M)
          sed -i -E "s#([a-z_]+)\.(js|css)\?v=[0-9]+\"#\1.\2?v=$v\"#g" docs/*.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Tunggu artifact terdaftar
        run: sleep 20
      - id: deploy
        uses: actions/deploy-pages@v4
